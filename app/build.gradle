plugins { id 'com.android.application' }
android {
    namespace 'top.liuwei.xbvr'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig { applicationId 'top.liuwei.xbvr'; minSdk 29; targetSdk 36; versionCode 9; versionName '0.2.7'; testInstrumentationRunner 'top.liuwei.xbvr.RendererFailureInstrumentation' }
    sourceSets { main { assets.srcDir layout.buildDirectory.dir('generated/legal-assets') } }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { development { storeFile file('../toolchain/debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    buildTypes { debug { signingConfig signingConfigs.development }; release { minifyEnabled false } }
}
tasks.register('syncLicenseAssets', Sync) {
    from('../licenses')
    into(layout.buildDirectory.dir('generated/legal-assets/licenses'))
}
tasks.named('preBuild').configure { dependsOn('syncLicenseAssets') }
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    implementation 'androidx.media3:media3-datasource-okhttp:1.8.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.json:json:20240303'
}
